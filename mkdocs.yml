site_name: Eurorack Envelope Follower Tutorial
site_description: End-to-End Hardware Design Tutorial with AI Skills, SKiDL, and KiCad 10
site_url: https://domesticmouse.github.io/EnvelopeFollower/
repo_url: https://github.com/domesticmouse/EnvelopeFollower
repo_name: domesticmouse/EnvelopeFollower
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Tutorial:
      - "Stage 1: Hardware Agent Skills": tutorial/stage-1-agent-skills.md
      - "Stage 2: Sketch & Circuit Upgrades": tutorial/stage-2-circuit-upgrades.md
      - "Stage 3: JLCPCB BOM, Walkthrough & Test Points": tutorial/stage-3-bom-and-dfm.md
      - "Stage 4: SKiDL Circuit & ERC": tutorial/stage-4-skidl.md
      - "Stage 5: Schematic & 6 HP PCB": tutorial/stage-5-schematic-and-pcb.md
      - "Stage 6: Routing, Pour & Audit": tutorial/stage-6-routing-and-drc.md
      - "Stage 7: Mated 3U Front Panel": tutorial/stage-7-front-panel.md
      - "Stage 8: JLCPCB PCBA & Assembly": tutorial/stage-8-manufacturing.md
  - Reference:
      - "Netlist, BOM & Capture Guide": reference/netlist-and-bom.md
      - "PCB & Fabrication Checklist": reference/build-checklist.md
