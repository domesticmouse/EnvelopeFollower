site_name: ENV / SKEW Build Tutorial
site_description: End-to-End Interactive Hardware Design Tutorial with AI Skills, SKiDL, VectorCraft, and KiCad 10
site_url: https://domesticmouse.github.io/EnvelopeFollower/
repo_url: https://github.com/domesticmouse/EnvelopeFollower
repo_name: domesticmouse/EnvelopeFollower
edit_uri: blob/main/docs/
exclude_docs: |
  agents/
  adr/

theme:
  name: material
  font: false
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark studio mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/fonts.css
  - stylesheets/prototype-theme.css
  - stylesheets/prototype-variants.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/prompt-copy.js
  - javascripts/prototype-switcher.js

nav:
  - Overview: index.md
  - Tutorial:
      - "Stage 1: Hardware Agent Skills & Repo Setup": tutorial/stage-1-agent-skills.md
      - "Stage 2: Sketch Extraction & Circuit Critique": tutorial/stage-2-circuit-upgrades.md
      - "Stage 3: Interactive DesignSpec & Test Points": tutorial/stage-3-bom-and-dfm.md
      - "Stage 4: SKiDL Capture & KiCad Schematic": tutorial/stage-4-skidl.md
      - "Stage 5: 6 HP PCB, silk_layout.json & /edit-silkscreen": tutorial/stage-5-schematic-and-pcb.md
      - "Stage 6: Mated 3U Front Panel & VectorCraft Artwork": tutorial/stage-6-front-panel.md
      - "Stage 7: Checklists, IBOM, Fabrication & Bring-Up": tutorial/stage-7-manufacturing.md
      - "Optional: AC/DC Input Coupling Mode": tutorial/optional-dc-coupled-mode.md
  - Appendix:
      - "Netlist, BOM & Capture Guide": reference/netlist-and-bom.md
      - "PCB & Fabrication Checklist": reference/build-checklist.md
